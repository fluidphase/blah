<style>

*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.45 "Figtree","Segoe UI",system-ui,sans-serif;background:var(--bg3);color:var(--txt)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:6px;background:var(--brand);color:#fff;padding:9px 14px;font-weight:600}
button.ghost{background:transparent;color:var(--mut);padding:4px 8px}
button.ghost:hover{color:var(--txt)}
input:focus{border-color:var(--brand);outline:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input{background:var(--bg1);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
[hidden]{display:none!important}

#login{height:100%;overflow:auto;display:flex;
 background:radial-gradient(900px 600px at 12% 8%,rgba(255,77,109,.38),transparent 60%),radial-gradient(800px 600px at 92% 95%,rgba(150,15,60,.55),transparent 60%),linear-gradient(135deg,#14070d,#2a0c1b)}
#login .box{width:min(440px,100%);min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:40px 36px;background:rgba(18,12,16,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-right:1px solid rgba(255,255,255,.09);box-shadow:12px 0 48px rgba(0,0,0,.4);text-align:left}
#login input{background:rgba(0,0,0,.35)}
.brand{font-family:"Outfit","Figtree",system-ui,sans-serif;font-weight:600;display:flex;align-items:center;gap:10px;color:var(--txt)}
.brand .logo{width:30px;height:26px;flex:none}
.brand.big{justify-content:flex-start;gap:14px;margin-bottom:6px}
.brand.big .logo{width:56px;height:47px}
.brand.big h1{font-size:38px;font-weight:600;letter-spacing:-.025em}
.form{display:grid;gap:12px;margin-top:10px}
.sub{color:var(--mut);margin-bottom:4px}
.small{font-size:13px;color:var(--mut);margin-top:4px}
button.link{background:none;padding:0;color:var(--brand2);font-weight:600;font-size:inherit}
button.link:hover{text-decoration:underline}
.err{color:#ff8a9d;font-size:13px;min-height:18px}

#app{height:100%;display:grid;grid-template-columns:auto 1fr}
#side{background:var(--bg2);display:flex;flex-direction:column;min-height:0}
#side h2{padding:12px 16px;font-size:22px;border-bottom:1px solid var(--line)}
.sec{display:flex;justify-content:space-between;align-items:center;padding:14px 12px 6px 16px;color:var(--mut);font-size:13px}
#chs{list-style:none;padding:0 8px;overflow:auto;flex:1}
#chs li button{width:100%;text-align:left;background:transparent;color:var(--mut);padding:7px 10px;font-weight:500}
#chs li button:hover{background:var(--bg3);color:var(--txt)}
#chs li.on button{background:var(--bg3);color:#fff}
#me{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg1)}
#me .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
#me .av{width:32px;height:32px;font-size:13px}

#main{display:flex;flex-direction:column;min-height:0;min-width:0}
#top{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700}
#menu{display:none}
#msgs{flex:1;overflow:auto;padding:12px 0}
.m{display:flex;gap:14px;padding:2px 16px}
.m.first{margin-top:14px}
.m:hover{background:rgba(255,255,255,.03)}
.m .gut{width:38px;flex:none;font-size:10px;color:transparent;text-align:right;padding-top:4px}

#nav{display:flex;min-height:0}
#side{width:240px}

button.outline{background:transparent;border:1px solid var(--brand);color:var(--brand2)}
dialog{background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(380px,92vw);margin:auto}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog h3{font:600 18px "Outfit","Figtree",sans-serif}
dialog hr{border:0;border-top:1px solid var(--line);margin:16px 0}
dialog .ghost{margin-top:8px}

.av.sm{width:28px;height:28px;font-size:11px}
.av.big{width:84px;height:84px;font-size:30px}
.click{cursor:pointer}
.who.click:hover{text-decoration:underline}
#me .av,#me .nm{cursor:pointer}
#me .nm:hover{text-decoration:underline}
#sideHead{display:flex;align-items:center;border-bottom:1px solid var(--line)}
#sideHead h2{flex:1;min-width:0;border:0}
#sideHead .ghost{margin-right:8px;font-size:17px}
#chs li button{display:flex;align-items:center;gap:8px}
.pcard{display:flex;gap:16px;align-items:center}
.pname{font:600 22px "Outfit","Figtree",sans-serif;overflow-wrap:anywhere}
.pbio{color:var(--mut);margin-top:4px;overflow-wrap:anywhere}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;padding:0;border:2px solid transparent}
.swatches button.on{border-color:#fff}
.srv.pv,.srv.pv:hover{border-radius:16px;background-color:var(--bg3);cursor:default;flex:none}
.m{position:relative}
.acts{position:absolute;right:16px;top:-8px;display:flex;gap:4px;opacity:0;z-index:1}
.m:hover .acts,.acts:focus-within{opacity:1}
.acts>button{padding:2px 9px;font-size:12px;background:var(--bg2);color:var(--mut);border:1px solid var(--line)}
.acts>button.del.arm{background:var(--err);border-color:var(--err);color:#fff}
@media(hover:none){.acts{opacity:.85}}
.picker{display:flex;gap:2px;padding:3px;background:var(--bg2);border:1px solid var(--line);border-radius:8px}
.picker button{font-size:16px;padding:1px 6px;border:0;background:transparent}
.rx{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.rx button{padding:1px 9px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);font-weight:500;font-size:13px}
.rx button.me{border-color:var(--brand);background:rgba(238,63,101,.16)}

@media(max-width:700px){
 #app{grid-template-columns:1fr}
 #nav{position:fixed;inset:0 10% 0 0;z-index:5;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 24px #0008}
 #nav.open{transform:none}
 #side{width:auto;flex:1}

}
@media(prefers-reduced-motion:reduce){#nav{transition:none}}
</style>

<script type="module">
/* ============ 1. PASTE YOUR FIREBASE CONFIG HERE ============ */
const firebaseConfig = {
  apiKey: "AIzaSyBPOABkONRlTbOjbs5a7GQCWCxGTEBMdUo",
  authDomain: "blahchatter.firebaseapp.com",
  projectId: "blahchatter",
  appId: "1:420178375007:web:197532956e108ac53886ea"
};
/* ============================================================ */

import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateProfile}
  from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
import {getFirestore,collection,addDoc,setDoc,getDoc,getDocs,updateDoc,arrayUnion,arrayRemove,doc,deleteDoc,query,where,orderBy,limit,onSnapshot,serverTimestamp}
  from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

// Invite code of the official blah server. Create the server in the app, copy its invite code
// (bottom of its sidebar), and paste it here. Leave "" to hide the "Join the official blah server" button.
const OFFICIAL_SERVER = "";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

let user = null, me = "";
let servers = [], dms = [], chans = [];
let view = null;                       // {kind:"home"} | {kind:"dm", id} | {kind:"server", sid, cid}
let unsubs = [], unsubChans = null, unsubMsgs = null, curPath = null;
let profiles = {}, lastDocs = [], firstLoad = true;
const watching = new Set();

const color = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h} 55% 48%)`; };
const initials = n => (n || "?").trim().slice(0, 2).toUpperCase();
const slug = s => (s || "").toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 30);
const code = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), b => "abcdefghjkmnpqrstuvwxyz23456789"[b % 31]).join("");
const dmName = d => (d.names && d.names[d.members.find(m => m !== user.uid)]) || "unknown";
const fail = err => {
  const box = $("msgs"); box.innerHTML = "";
  const d = document.createElement("div"); d.className = "empty";
  d.textContent = "Firestore said: " + err.message + " (check that your security rules are published)";
  box.append(d);
};

/* ---------- profile pictures + server icons ---------- */
const isImg = s => typeof s === "string" && s.startsWith("data:image/");
const isHex = s => typeof s === "string" && /^#[0-9a-f]{6}$/i.test(s);
function paint(el, pr, name, uid) {
  pr = pr || {};
  el.style.backgroundColor = isHex(pr.color) ? pr.color : color(uid || name);
  el.style.backgroundSize = "cover"; el.style.backgroundPosition = "center";
  if (isImg(pr.photo)) { el.style.backgroundImage = `url("${pr.photo}")`; el.textContent = ""; }
  else { el.style.backgroundImage = ""; el.textContent = initials(name); }
}
function paintBanner(el, pr, uid) {
  el.style.backgroundColor = isHex(pr.color) ? pr.color : color(uid);
  el.style.backgroundImage = isImg(pr.banner) ? `url("${pr.banner}")` : "";
}
function paintServer(el, s) {
  const ok = isImg(s.icon);
  el.style.backgroundImage = ok ? `url("${s.icon}")` : "";
  el.style.backgroundSize = "cover"; el.style.backgroundPosition = "center";
  el.textContent = ok ? "" : initials(s.name);
}
function watchProfile(uid) {
  if (watching.has(uid)) return; watching.add(uid);
  unsubs.push(onSnapshot(doc(db, "users", uid), s => { profiles[uid] = s.exists() ? s.data() : {}; refresh(); }, () => {}));
}
function av(uid, name, cls = "") {
  watchProfile(uid);
  const d = document.createElement("div"); d.className = ("av " + cls).trim();
  paint(d, profiles[uid], name, uid); return d;
}
let raf = 0;
function refresh() {
  if (raf) return;
  raf = requestAnimationFrame(() => { raf = 0; if (!user) return; updateMe(); renderSide(); renderMsgs(false); });
}
function updateMe() { paint($("meAv"), profiles[user.uid], me, user.uid); }
// Crops + shrinks to w x h (JPEG). GIFs are kept as-is (animated) when anim is true and the file is small enough.
function prepImage(file, w = 128, h = w, anim = true) {
  return new Promise((res, rej) => {
    if (anim && file.type === "image/gif") {
      if (file.size > 400000) return rej(new Error("That GIF is over 400 KB. Try a smaller one."));
      const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error("Couldn't read that file.")); r.readAsDataURL(file); return;
    }
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.max(w / img.width, h / img.height), sw = w / k, sh = h / k;
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const g = c.getContext("2d"); g.fillStyle = "#2c2d32"; g.fillRect(0, 0, w, h);
      g.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("That file isn't an image we can read.")); };
    img.src = url;
  });
}
const toSquare = f => prepImage(f);

const EMOJI = {like: "👍", heart: "❤️", laugh: "😂", wow: "😮", sad: "😢", fire: "🔥"};
async function react(path, m, key) {
  const has = ((m.reactions || {})[key] || []).includes(user.uid);
  try { await updateDoc(doc(db, ...path, m.id), {["reactions." + key]: has ? arrayRemove(user.uid) : arrayUnion(user.uid)}); }
  catch (err) { alert("Couldn't react: " + err.message); }
}

/* ---------- auth ---------- */
// Firebase Auth needs an email, so a username becomes username@users.blah.chat behind the scenes.
const toEmail = n => n.toLowerCase() + "@users.blah.chat";
const nameOf = u => u.displayName || (u.email || "").split("@")[0];
const BAD = "Wrong username or password.";
const MSG = {
  "auth/invalid-credential": BAD, "auth/invalid-login-credentials": BAD, "auth/user-not-found": BAD, "auth/wrong-password": BAD,
  "auth/email-already-in-use": "That username is taken.",
  "auth/weak-password": "Password needs at least 6 characters.",
  "auth/too-many-requests": "Too many attempts. Try again in a few minutes.",
  "auth/network-request-failed": "Can't reach Firebase. Check your connection.",
  "auth/operation-not-allowed": "Turn on Email/Password in Firebase Console → Authentication → Sign-in method."
};
const showErr = (id, e) => { $(id).textContent = typeof e === "string" ? e : (MSG[e.code] || e.message); };
const show = which => {
  $("signin").hidden = which !== "signin"; $("signup").hidden = which !== "signup";
  $("err1").textContent = $("err2").textContent = "";
};
$("toSignup").onclick = () => show("signup");
$("toSignin").onclick = () => show("signin");

let creating = false;
$("signin").onsubmit = async e => {
  e.preventDefault();
  const n = $("inUser").value.trim(), pw = $("inPass").value;
  if (!n || !pw) return showErr("err1", "Enter your username and password.");
  try { await signInWithEmailAndPassword(auth, toEmail(n), pw); } catch (err) { showErr("err1", err); }
};
$("signup").onsubmit = async e => {
  e.preventDefault();
  const n = $("upUser").value.trim(), pw = $("upPass").value;
  if (!/^[A-Za-z0-9_]{3,20}$/.test(n)) return showErr("err2", "Username: 3–20 letters, numbers or underscores.");
  if (pw.length < 6) return showErr("err2", "Password needs at least 6 characters.");
  if (pw !== $("upPass2").value) return showErr("err2", "Passwords don't match.");
  creating = true;
  try {
    const {user: u} = await createUserWithEmailAndPassword(auth, toEmail(n), pw);
    try { await updateProfile(u, {displayName: n}); } catch {}
    creating = false;
    start(auth.currentUser);
  } catch (err) { creating = false; showErr("err2", err); }
};
$("out").onclick = () => signOut(auth);
onAuthStateChanged(auth, u => { if (creating) return; u ? start(u) : stop(); });

function start(u) {
  unsubs.forEach(f => f()); unsubs = []; watching.clear(); profiles = {};
  user = u; me = nameOf(u);
  $("login").hidden = true; $("app").hidden = false;
  $("meNm").textContent = me;
  watchProfile(u.uid); updateMe();
  // public directory entry so people can find you by username for DMs
  setDoc(doc(db, "users", u.uid), {name: me, nameLower: me.toLowerCase()}, {merge: true}).catch(() => {});
  unsubs.push(onSnapshot(query(collection(db, "servers"), where("members", "array-contains", u.uid)), snap => {
    servers = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => a.name.localeCompare(b.name));
    if (view && view.kind === "server" && !servers.find(s => s.id === view.sid)) return go({kind: "home"});
    renderRail(); renderSide();
    if (view.kind === "home") openMsgs();
  }, fail));
  unsubs.push(onSnapshot(query(collection(db, "dms"), where("members", "array-contains", u.uid)), snap => {
    dms = snap.docs.map(d => ({id: d.id, ...d.data()}));
    renderSide();
  }, fail));
  go({kind: "home"});
}
function stop() {
  unsubs.forEach(f => f()); unsubs = []; watching.clear(); profiles = {};
  unsubChans && unsubChans(); unsubMsgs && unsubMsgs(); unsubChans = unsubMsgs = null;
  user = null; view = null; servers = []; dms = []; chans = []; curPath = null;
  $("app").hidden = true; $("login").hidden = false;
  $("inPass").value = ""; show("signin");
}

/* ---------- navigation ---------- */
function go(v) {
  view = v; chans = [];
  unsubChans && unsubChans(); unsubChans = null;
  if (v.kind === "server") {
    unsubChans = onSnapshot(query(collection(db, "servers", v.sid, "channels"), orderBy("createdAt")), snap => {
      if (view !== v) return;
      chans = snap.docs.map(d => ({id: d.id, ...d.data()}));
      if (!v.cid && chans.length) { v.cid = chans[0].id; openMsgs(); }
      renderSide();
    }, fail);
  }
  renderRail(); renderSide(); openMsgs();
}

function renderRail() {
  $("home").classList.toggle("on", view.kind !== "server");
  const box = $("srvs"); box.innerHTML = "";
  for (const s of servers) {
    const b = document.createElement("button");
    b.className = "srv" + (view.kind === "server" && view.sid === s.id ? " on" : "");
    paintServer(b, s); b.title = s.name; b.setAttribute("aria-label", s.name);
    b.onclick = () => go({kind: "server", sid: s.id});
    box.append(b);
  }
}

function linkTitle() {
  const t = $("chTitle");
  if (view && view.kind === "dm") {
    const d = dms.find(x => x.id === view.id);
    if (d) {
      const o = d.members.find(m => m !== user.uid), n = dmName(d);
      t.textContent = "@ " + n; t.className = "click"; t.title = "View profile"; t.onclick = () => openProfile(o, n); return;
    }
  }
  t.className = ""; t.title = ""; t.onclick = null;
}

function renderSide() {
  if (!view) return;
  linkTitle();
  const ul = $("chs"); ul.innerHTML = "";
  const item = (label, on, fn, lead) => {
    const li = document.createElement("li"); if (on) li.className = "on";
    const b = document.createElement("button"); b.textContent = label; if (lead) b.prepend(lead);
    b.onclick = () => { fn(); $("nav").classList.remove("open"); };
    li.append(b); ul.append(li);
  };
  if (view.kind === "server") {
    const s = servers.find(x => x.id === view.sid);
    $("sideTitle").textContent = s ? s.name : "…";
    $("srvSet").hidden = !(s && s.ownerId === user.uid);
    $("listLabel").textContent = "Channels"; $("addCh").title = $("addCh").ariaLabel = "New channel";
    chans.forEach(c => item("# " + c.name, c.id === view.cid, () => { view.cid = c.id; renderSide(); openMsgs(); }));
    $("inv").hidden = false; $("copyInv").textContent = view.sid;
  } else {
    $("sideTitle").textContent = "Direct messages"; $("srvSet").hidden = true;
    $("listLabel").textContent = "People"; $("addCh").title = $("addCh").ariaLabel = "New message";
    dms.forEach(d => { const o = d.members.find(m => m !== user.uid); item(dmName(d), view.kind === "dm" && view.id === d.id, () => go({kind: "dm", id: d.id}), av(o, dmName(d), "sm")); });
    $("inv").hidden = true;
  }
}

/* ---------- servers, channels, DMs ---------- */
$("home").onclick = () => { go({kind: "home"}); $("nav").classList.remove("open"); };
$("menu").onclick = () => $("nav").classList.toggle("open");
$("addCh").onclick = () => view.kind === "server" ? newChannel() : newDM();
$("addSrv").onclick = () => { $("dErr").textContent = ""; $("dlg").showModal(); };
$("dClose").onclick = () => $("dlg").close();

$("mk").onsubmit = async e => {
  e.preventDefault();
  const name = $("mkName").value.trim(); if (!name) return;
  const id = code();
  try {
    await setDoc(doc(db, "servers", id), {name, ownerId: user.uid, members: [user.uid], createdAt: serverTimestamp()});
    await setDoc(doc(db, "servers", id, "channels", "general"), {name: "general", createdAt: serverTimestamp()});
    $("mkName").value = ""; $("dlg").close();
    go({kind: "server", sid: id, cid: "general"});
  } catch (err) { $("dErr").textContent = err.message; }
};
async function joinServer(id) {
  const ref = doc(db, "servers", id);
  try {
    if (!(await getDoc(ref)).exists()) return "No server with that code.";
    if (!servers.find(s => s.id === id)) await updateDoc(ref, {members: arrayUnion(user.uid)});
    go({kind: "server", sid: id});
    return "";
  } catch (err) { return err.code === "permission-denied" ? "No server with that code." : err.message; }
}
$("jn").onsubmit = async e => {
  e.preventDefault();
  const id = $("jnCode").value.trim().toLowerCase(); if (!id) return;
  const msg = await joinServer(id);
  $("dErr").textContent = msg;
  if (!msg) { $("jnCode").value = ""; $("dlg").close(); }
};
$("copyInv").onclick = async () => {
  try { await navigator.clipboard.writeText(view.sid); $("copyInv").textContent = "Copied!"; setTimeout(renderSide, 1200); }
  catch { prompt("Invite code", view.sid); }
};

async function newChannel() {
  const name = slug(prompt("New channel name")); if (!name) return;
  try {
    await setDoc(doc(db, "servers", view.sid, "channels", name), {name, createdAt: serverTimestamp()});
    view.cid = name; renderSide(); openMsgs();
  } catch (err) { alert(err.message); }
}
async function newDM() {
  const raw = (prompt("Username to message") || "").trim().toLowerCase(); if (!raw) return;
  try {
    const snap = await getDocs(query(collection(db, "users"), where("nameLower", "==", raw), limit(1)));
    if (snap.empty) return alert("No one named “" + raw + "” yet. They need to log in to blah once.");
    const other = snap.docs[0];
    if (other.id === user.uid) return alert("That's you!");
    await openDM(other.id, other.data().name);
  } catch (err) { alert(err.message); }
}
async function openDM(otherId, otherName) {
  const members = [user.uid, otherId].sort();
  const id = members.join("_");
  await setDoc(doc(db, "dms", id), {members, names: {[user.uid]: me, [otherId]: otherName}});
  go({kind: "dm", id});
}

/* ---------- messages (live) ---------- */
function openMsgs() {
  unsubMsgs && unsubMsgs(); unsubMsgs = null;
  const box = $("msgs");
  let title = "";
  curPath = null; lastDocs = []; firstLoad = true;
  if (view.kind === "server" && view.cid) {
    const c = chans.find(x => x.id === view.cid);
    curPath = ["servers", view.sid, "channels", view.cid, "messages"]; title = "# " + (c ? c.name : view.cid);
  } else if (view.kind === "dm") {
    const d = dms.find(x => x.id === view.id);
    curPath = ["dms", view.id, "messages"]; title = "@ " + (d ? dmName(d) : "…");
  }
  $("chTitle").textContent = curPath ? title : "blah";
  linkTitle();
  $("txt").disabled = !curPath;
  $("txt").placeholder = curPath ? "Message " + title : "Nothing open yet";
  if (!curPath) {
    box.innerHTML = "";
    const d = document.createElement("div"); d.className = "empty";
    const t = document.createElement("p");
    t.textContent = view.kind === "server" ? "This server has no channels yet. Press + to add one."
      : "Pick a conversation, or press + next to People to message someone by username. Use the + in the left bar to create or join a server.";
    d.append(t);
    if (view.kind === "home" && OFFICIAL_SERVER) {
      const b = document.createElement("button");
      b.textContent = servers.some(s => s.id === OFFICIAL_SERVER) ? "Open the official blah server" : "Join the official blah server";
      b.onclick = async () => { b.disabled = true; const msg = await joinServer(OFFICIAL_SERVER); if (msg) { b.disabled = false; alert(msg); } };
      d.append(b);
    }
    box.append(d); return;
  }
  const q = query(collection(db, ...curPath), orderBy("createdAt", "desc"), limit(100));
  unsubMsgs = onSnapshot(q, snap => {
    lastDocs = snap.docs.map(d => ({id: d.id, ...d.data({serverTimestamps: "estimate"}), pending: d.metadata.hasPendingWrites})).reverse();
    renderMsgs(true);
  }, fail);
}

function renderMsgs(fromSnap) {
  if (!curPath || (firstLoad && !fromSnap)) return;
  const box = $("msgs"), path = curPath;
  const srv = view.kind === "server" ? servers.find(s => s.id === view.sid) : null;
  const owner = !!srv && srv.ownerId === user.uid;
  const top = box.scrollTop, nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  box.innerHTML = "";
  if (!lastDocs.length) { const d = document.createElement("div"); d.className = "empty"; d.textContent = "No messages yet. Say something."; box.append(d); }
  let prev = null;
  for (const m of lastDocs) {
    const t = m.createdAt ? m.createdAt.toDate() : new Date();
    const joined = prev && prev.uid === m.uid && t - prev.t < 5 * 60e3;
    const row = document.createElement("div");
    row.className = "m" + (joined ? "" : " first") + (m.pending ? " pend" : "");
    const time = t.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
    if (joined) {
      const g = document.createElement("div"); g.className = "gut"; g.textContent = time; row.append(g);
    } else {
      const a = av(m.uid, m.name, "click"); a.onclick = () => openProfile(m.uid, m.name); row.append(a);
    }
    const c = document.createElement("div");
    if (!joined) {
      const h = document.createElement("div");
      const w = document.createElement("span"); w.className = "who click"; w.textContent = m.name; w.style.color = color(m.uid);
      w.onclick = () => openProfile(m.uid, m.name);
      const s = document.createElement("span"); s.className = "when"; s.textContent = t.toLocaleDateString([], {month: "short", day: "numeric"}) + ", " + time;
      h.append(w, s); c.append(h);
    }
    const b = document.createElement("div"); b.className = "body"; b.textContent = m.text; c.append(b);
    const rx = document.createElement("div"); rx.className = "rx";
    for (const k of Object.keys(EMOJI)) {
      const who = (m.reactions && m.reactions[k]) || [];
      if (!who.length) continue;
      const b = document.createElement("button"); b.type = "button";
      b.className = who.includes(user.uid) ? "me" : ""; b.textContent = EMOJI[k] + " " + who.length;
      b.onclick = () => react(path, m, k); rx.append(b);
    }
    if (rx.children.length) c.append(rx);
    row.append(c);
    if (m.id) {
      const acts = document.createElement("div"); acts.className = "acts";
      const rb = document.createElement("button"); rb.type = "button"; rb.textContent = "☺"; rb.setAttribute("aria-label", "Add reaction");
      rb.onclick = () => {
        const old = acts.querySelector(".picker"); if (old) return old.remove();
        const pk = document.createElement("div"); pk.className = "picker";
        for (const k of Object.keys(EMOJI)) {
          const e = document.createElement("button"); e.type = "button"; e.textContent = EMOJI[k];
          e.onclick = () => react(path, m, k); pk.append(e);
        }
        acts.prepend(pk);
      };
      acts.append(rb);
      if (m.uid === user.uid || owner) {
        const x = document.createElement("button"); x.type = "button"; x.className = "del"; x.textContent = "Delete";
        x.setAttribute("aria-label", "Delete message");
        let timer;
        x.onclick = async () => {
          if (!x.classList.contains("arm")) {
            x.classList.add("arm"); x.textContent = "Sure?";
            timer = setTimeout(() => { x.classList.remove("arm"); x.textContent = "Delete"; }, 3000); return;
          }
          clearTimeout(timer);
          try { await deleteDoc(doc(db, ...path, m.id)); } catch (err) { alert("Couldn't delete: " + err.message); }
        };
        acts.append(x);
      }
      row.append(acts);
    }
    box.append(row);
    prev = {uid: m.uid, t};
  }
  if (firstLoad || nearBottom) box.scrollTop = box.scrollHeight; else box.scrollTop = top;
  if (fromSnap) firstLoad = false;
}

$("f").onsubmit = async e => {
  e.preventDefault();
  const text = $("txt").value.trim();
  if (!text || !user || !curPath) return;
  $("txt").value = "";
  try {
    await addDoc(collection(db, ...curPath), {text, uid: user.uid, name: me, createdAt: serverTimestamp()});
    const box = $("msgs"); box.scrollTop = box.scrollHeight;
  } catch (err) { alert("Send failed: " + err.message); $("txt").value = text; }
};
/* ---------- profile dialog ---------- */
const COLORS = ["#ee3f65", "#f59e0b", "#22c55e", "#14b8a6", "#3b82f6", "#8b5cf6", "#ec4899", "#64748b"];
let draft = {}, pUid = null, sdraft = {};
COLORS.forEach(c => {
  const b = document.createElement("button"); b.type = "button"; b.style.background = c; b.dataset.c = c; b.setAttribute("aria-label", "Color " + c);
  b.onclick = () => { draft.color = draft.color === c ? "" : c; drawProfile(); };
  $("pColors").append(b);
});
function drawProfile() {
  paint($("pAv"), draft, $("pName").textContent, pUid); paintBanner($("pBanner"), draft, pUid);
  [...$("pColors").children].forEach(b => b.classList.toggle("on", b.dataset.c === draft.color));
}
function openProfile(uid, name) {
  pUid = uid; watchProfile(uid);
  const pr = profiles[uid] || {}, mine = uid === user.uid;
  draft = {photo: pr.photo || "", color: pr.color || "", banner: pr.banner || ""};
  $("pName").textContent = name;
  $("pBio").textContent = mine ? "" : (pr.bio || "No bio yet.");
  $("pBioIn").value = pr.bio || "";
  $("pEdit").hidden = !mine; $("pDm").hidden = mine; $("pErr").textContent = "";
  drawProfile(); $("pdlg").showModal();
}
$("meAv").onclick = $("meNm").onclick = () => openProfile(user.uid, me);
$("pClose").onclick = () => $("pdlg").close();
$("pPick").onclick = () => $("pFile").click();
$("pClear").onclick = () => { draft.photo = ""; drawProfile(); };
$("pFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { draft.photo = await toSquare(f); drawProfile(); } catch (err) { $("pErr").textContent = err.message; }
};
$("pSave").onclick = async () => {
  try {
    await setDoc(doc(db, "users", user.uid), {photo: draft.photo, color: draft.color, banner: draft.banner, bio: $("pBioIn").value.trim().slice(0, 120)}, {merge: true});
    $("pdlg").close();
  } catch (err) { $("pErr").textContent = err.message; }
};
$("pDm").onclick = async () => {
  try { $("pdlg").close(); await openDM(pUid, $("pName").textContent); $("nav").classList.remove("open"); } catch (err) { alert(err.message); }
};
$("pBanPick").onclick = () => $("pBanFile").click();
$("pBanClear").onclick = () => { draft.banner = ""; drawProfile(); };
$("pBanFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { draft.banner = await prepImage(f, 480, 160, false); drawProfile(); } catch (err) { $("pErr").textContent = err.message; }
};

/* ---------- server settings (owner only) ---------- */
const drawServer = () => paintServer($("sIcon"), {name: $("sName").value || "?", icon: sdraft.icon});
$("srvSet").onclick = () => {
  const s = servers.find(x => x.id === view.sid); if (!s) return;
  sdraft = {icon: s.icon || ""}; $("sName").value = s.name; $("sErr").textContent = "";
  drawServer(); $("sdlg").showModal();
};
$("sName").oninput = drawServer;
$("sClose").onclick = () => $("sdlg").close();
$("sPick").onclick = () => $("sFile").click();
$("sClear").onclick = () => { sdraft.icon = ""; drawServer(); };
$("sFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { sdraft.icon = await toSquare(f); drawServer(); } catch (err) { $("sErr").textContent = err.message; }
};
$("sSave").onclick = async () => {
  const name = $("sName").value.trim().slice(0, 32);
  if (!name) return $("sErr").textContent = "Give the server a name.";
  try { await updateDoc(doc(db, "servers", view.sid), {name, icon: sdraft.icon}); $("sdlg").close(); }
  catch (err) { $("sErr").textContent = err.message; }
};
</script>
